version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18
    container_name: neo4j_graphrag

    ports:
      - "7474:7474"
      - "7687:7687"
      
    environment:
      NEO4J_AUTH: neo4j/password
      
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:

